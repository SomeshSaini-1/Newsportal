<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/reficon.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mediaplus News</title>
    <meta
      property="og:title"
      content="Mediaplus News - Latest Updates & Breaking News"
    />
    <meta
      property="og:description"
      content="Stay informed with real-time news, articles, and stories from India and around the world on Mediaplus Bharat."
    />
    <meta property="og:type" content="website" />
    <!-- <meta property="og:url" content="https://mediaplusbharat.com" /> -->
    <!-- change to your actual domain -->

    <!-- The image that ALWAYS shows (this is the key part) -->
    <meta
      property="og:image"
      content="https://api.mediaplusbharat.com/uploads/Enews/1771898743005-312194033.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mediaplus News Preview" />

    <!-- Twitter/X cards (WhatsApp sometimes falls back to these) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mediaplus News - Latest Updates & Breaking News"
    />
    <meta
      name="twitter:description"
      content="Stay informed with real-time news, articles, and stories from India and around the world."
    />
    <meta
      name="twitter:image"
      content="https://api.mediaplusbharat.com/uploads/Enews/1771898743005-312194033.jpg"
    />

    <!-- Optional: Force large preview on WhatsApp -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
