<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Paper Viewer | Media Plus News</title>

    <link rel="icon" type="image/svg+xml" href="https://api.mediaplusbharat.com/uploads/Enews/1771898743005-312194033.jpg" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'paper-dark': '#0f0f0f',
          }
        }
      }
    }
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="E-Paper Viewer"/>
  <meta property="og:description" content="Read e-paper on Media Plus News"/>
  <meta property="og:image" content="https://api.mediaplusbharat.com/uploads/Enews/1771898743005-312194033.jpg"/>
  <meta property="og:type" content="article"/>
  <meta property="og:url" content="https://api.mediaplusbharat.com/uploads/Enews/1771898743005-312194033.jpg"/>
</head>
<body class="bg-black text-white min-h-screen overflow-hidden antialiased">

<div id="app" class="fixed inset-0 flex flex-col">

  <!-- Loading -->
  <div id="loading" class="fixed inset-0 bg-black flex items-center justify-center z-50">
    <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- Error -->
  <div id="error" class="fixed inset-0 bg-black hidden flex flex-col items-center justify-center z-50 px-4">
    <p id="error-msg" class="text-xl md:text-2xl text-red-400 mb-6 text-center">Failed to load e-paper</p>
    <button id="back-btn" class="flex items-center gap-2 px-6 py-3 bg-white/10 hover:bg-white/20 rounded-xl transition">
      <span>←</span> Back to List
    </button>
  </div>

  <!-- Main content -->
  <div id="main-content" class="hidden flex flex-col h-full">

    <!-- Header -->
    <header class="bg-gradient-to-b from-black/90 to-transparent p-4 md:p-5 flex justify-between items-start z-10">
      <div class="flex-1 min-w-0">
        <h2 id="title" class="text-lg md:text-2xl font-semibold mb-1 truncate">
          Loading...
        </h2>
        <div class="flex flex-wrap items-center gap-4 text-sm text-gray-300">
          <span id="date" class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            —
          </span>
          <span id="page-info">Page 1 of —</span>
        </div>
      </div>
      <button onclick="window.location.href='/enews'" class="p-2 hover:bg-white/10 rounded-full transition text-3xl leading-none" title="Close (Esc)">
        ×
      </button>
    </header>

    <!-- Image Viewer -->
    <main class="flex-1 relative overflow-auto flex items-center justify-center p-4 md:p-6">
      <img
        id="main-image"
        src=""
        alt="E-Paper Page"
        class="max-w-full max-h-full object-contain transition-transform duration-300"
        draggable="false"
      />

      <button id="prev-btn" class="hidden md:flex absolute left-6 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-5 rounded-full backdrop-blur-md transition z-20 text-4xl">
        ‹
      </button>
      <button id="next-btn" class="hidden md:flex absolute right-6 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-5 rounded-full backdrop-blur-md transition z-20 text-4xl">
        ›
      </button>
    </main>

    <!-- Footer Controls -->
    <footer class="bg-gradient-to-t from-black/90 to-transparent p-4 md:p-5 z-10">
      <div class="max-w-5xl mx-auto flex flex-col items-center gap-5">

        <div class="flex flex-wrap justify-center gap-4">
          <!-- Download -->
          <button id="download-btn" class="flex items-center gap-2 px-6 py-3 bg-green-700 hover:bg-green-600 active:bg-green-800 rounded-xl font-medium transition shadow-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Full Page
          </button>

          <!-- Back -->
          <button onclick="window.location.href='/enews'" class="flex items-center gap-2 px-6 py-3 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10 transition font-medium">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Back to List
          </button>
        </div>

        <!-- Page Dots -->
        <div id="page-dots" class="flex flex-wrap justify-center gap-2.5 max-w-full px-2"></div>

      </div>
    </footer>

  </div>

</div>

<script>
// ────────────────────────────────────────────────
const API_BASE_URL = "https://api.mediaplusbharat.com/api";   // ← CHANGE THIS
const IMG_BASE_URL  = "https://api.mediaplusbharat.com"; // ← CHANGE THIS

const urlParams = new URLSearchParams(window.location.search);
const epaperId = urlParams.get("id") || "";

let images = [];
let currentIndex = 0;
let title = "";
let createdAt = "";

const els = {
  loading:    document.getElementById("loading"),
  error:      document.getElementById("error"),
  errorMsg:   document.getElementById("error-msg"),
  main:       document.getElementById("main-content"),
  titleEl:    document.getElementById("title"),
  dateEl:     document.getElementById("date"),
  pageInfo:   document.getElementById("page-info"),
  image:      document.getElementById("main-image"),
  prev:       document.getElementById("prev-btn"),
  next:       document.getElementById("next-btn"),
  dots:       document.getElementById("page-dots"),
  download:   document.getElementById("download-btn"),
};

async function loadEpaper() {
  if (!epaperId) return showError("No e-paper ID in URL (?id=...)");

  try {
    const res = await fetch(`${API_BASE_URL}/news/getEnews?id=${epaperId}`);
    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    const epaper = Array.isArray(data) ? data[0] : data;

    if (!epaper?.eimg) throw new Error("No content found");

    images = Array.isArray(epaper.eimg) ? epaper.eimg : [epaper.eimg];
    title = epaper.title || "Untitled E-Paper";
    createdAt = epaper.createdAt || new Date().toISOString();

    // Update metadata
    document.title = `${title} | Media Plus News`;
    document.querySelector('meta[property="og:title"]').content = title;
    document.querySelector('meta[property="og:image"]').content = getImageUrl(0);

    render();
    els.loading.classList.add("hidden");
    els.main.classList.remove("hidden");
  } catch (err) {
    console.error(err);
    showError("Failed to load e-paper. Please try again.");
  }
}

function getImageUrl(idx) {
  const path = images[idx]?.replace(/\\/g, "/") || "";
  return `${IMG_BASE_URL}/${path}`;
}

function render() {
  els.image.src = getImageUrl(currentIndex);
  els.image.alt = `${title} — Page ${currentIndex + 1}`;

  els.titleEl.textContent = title;
  els.dateEl.textContent = new Date(createdAt).toLocaleDateString('en-IN', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
  els.pageInfo.textContent = `Page ${currentIndex + 1} of ${images.length}`;

  els.prev.style.display = currentIndex > 0 ? "flex" : "none";
  els.next.style.display = currentIndex < images.length - 1 ? "flex" : "none";

  // Page dots
  els.dots.innerHTML = "";
  images.forEach((_, i) => {
    const dot = document.createElement("button");
    dot.className = `h-2 rounded-full transition-all duration-300 ${
      i === currentIndex
        ? "w-10 bg-blue-500"
        : "w-3 bg-white/30 hover:bg-white/50"
    }`;
    dot.onclick = () => { currentIndex = i; render(); };
    els.dots.appendChild(dot);
  });
}

function showError(msg) {
  els.loading.classList.add("hidden");
  els.errorMsg.textContent = msg;
  els.error.classList.remove("hidden");
}

// Navigation
els.prev.onclick = () => { if (currentIndex > 0) { currentIndex--; render(); } };
els.next.onclick = () => { if (currentIndex < images.length - 1) { currentIndex++; render(); } };

// Download
els.download.onclick = () => {
  const a = document.createElement("a");
  a.href = els.image.src;
  a.download = `${title.replace(/\s+/g, "-")}-page-${currentIndex + 1}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

// Keyboard
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft")  els.prev.click();
  if (e.key === "ArrowRight") els.next.click();
  if (e.key === "Escape")     window.location.href = "/enews";
});

// Start
loadEpaper();
</script>
</body>
</html>
